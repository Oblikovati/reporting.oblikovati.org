name: Deploy

# Test → build and push the image to GHCR → deploy its immutable tag to Hetzner K3s.
# Runtime secrets stay in the Kubernetes Secret and never enter the image or repository.

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/oblikovati/reporting.oblikovati.org

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: true
      - run: go test ./...

  build-push:
    runs-on: ubuntu-latest
    needs: test
    outputs:
      image: ${{ steps.meta.outputs.ref }}
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve image ref
        id: meta
        run: echo "ref=${IMAGE}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.ref }}
            ${{ env.IMAGE }}:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build-push
    steps:
      - uses: actions/checkout@v4
      - name: Open K3s API tunnel
        env:
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$HETZNER_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' '65.109.19.20 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIO2uONzdbVdL8rkEb1XNxil1OWuFZYJheESxuwEOfItw' > ~/.ssh/known_hosts
          ssh -fN -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=yes -L 16443:127.0.0.1:6443 root@65.109.19.20
      - name: Deploy immutable image
        env:
          KUBECONFIG_HETZNER: ${{ secrets.KUBECONFIG_HETZNER }}
          IMAGE_REF: ${{ needs.build-push.outputs.image }}
          REPORTING_GITHUB_TOKEN: ${{ secrets.REPORTING_GITHUB_TOKEN }}
        run: |
          printf '%s' "$KUBECONFIG_HETZNER" > kubeconfig
          export KUBECONFIG="$PWD/kubeconfig"
          kubectl create secret generic reporting-secrets --namespace oblikovati \
            --from-literal=REPORTING_GITHUB_TOKEN="$REPORTING_GITHUB_TOKEN" \
            --dry-run=client -o yaml | kubectl apply -f -
          sed "s|${IMAGE}:placeholder|${IMAGE_REF}|" deploy/kubernetes/production.yaml | kubectl apply -f -
